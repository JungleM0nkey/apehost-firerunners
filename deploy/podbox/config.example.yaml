# /etc/fireactions/config.yaml on podbox (mode 0600, root). The live file embeds
# the GitHub App private key; never commit it. App: apehost-fireactions.
bind_address: 127.0.0.1:18080     # 8080/8081 are taken on podbox
metrics:
  enabled: true
  address: 127.0.0.1:18081
containerd:
  # Dedicated containerd 1.7 from setup.sh, NOT Docker's /run/containerd.
  address: /run/fireactions-containerd/containerd.sock
  namespace: fireactions
github:
  app_id: 5235650
  app_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    ... contents of /etc/fireactions/app.pem, indented 4 spaces ...
pools:
- name: fireactions-4vcpu-8gb
  replicas: 2
  runner:
    name: fa-dashboard
    image: ghcr.io/hostinger/fireactions-images/ubuntu24.04:20260901114140
    image_pull_policy: IfNotPresent
    group_id: 1
    organization: JungleM0nkey             # owner (user or org)
    repository: apehost-connect-dashboard  # set => repo-level runners (personal accounts)
    labels: [self-hosted, fireactions, fireactions-4vcpu-8gb]
  # Optional: added to the runner env in every VM of this pool, so every job
  # step sees them (#8). Values are never logged; this file is 0600.
  # Names must not be PATH/HOME/USER/LOGNAME/UID/GID or start with
  # GITHUB_/ACTIONS_/RUNNER_.
  # env:
  #   TURBO_API: http://10.200.0.1:8787
  #   TURBO_TOKEN: <proxy token>
  #   TURBO_CACHE: remote:rw
  firecracker:
    binary_path: /usr/local/bin/firecracker
    kernel_image_path: /var/lib/fireactions/kernels/6.18/vmlinux
    # No `noapic`: Firecracker >=1.8 describes virtio-mmio devices via ACPI and
    # noapic leaves them without IRQs (no rootfs/vsock -> VM crash loop).
    kernel_args: "console=ttyS0 reboot=k panic=1 pci=off nomodules rw"
    machine_config:
      vcpu_count: 4
      mem_size_mib: 8192
log_level: info
